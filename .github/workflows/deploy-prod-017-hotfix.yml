name: Deploy isolated production-017 security hotfix

on:
  workflow_dispatch:
    inputs:
      admission_mode:
        description: Use the existing protected GitHub gate or owner-authorized manual record
        type: choice
        options:
          - gha
          - manual
        default: gha
        required: true
      manual_attempt_id:
        description: Required only for manual mode; must exactly match the owner authorization comment
        type: string
        required: false
      authorization_comment_id:
        description: Required only for manual mode; Issue 92 comment authored by the repository owner
        type: string
        required: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate fixed production-017 candidate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require workflow source from main
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$TRUSTED_WORKFLOW_SHA" origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Checkout fixed candidate commit
        uses: actions/checkout@v4
        with:
          ref: d4a13a61cc0d24c4eda96a7baffaacfd0e47c191
          path: release-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fixed release and selected authorization mode
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          MANUAL_ATTEMPT_ID: ${{ inputs.manual_attempt_id }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          case "$ADMISSION_MODE" in
            gha)
              test -z "$MANUAL_ATTEMPT_ID"
              test -z "$AUTHORIZATION_COMMENT_ID"
              sh scripts/validate-prod-017-hotfix.sh "$GITHUB_WORKSPACE/release-candidate"
              ;;
            manual)
              test -n "$MANUAL_ATTEMPT_ID"
              test -n "$AUTHORIZATION_COMMENT_ID"
              sh scripts/validate-prod-017-hotfix.sh "$GITHUB_WORKSPACE/release-candidate" manual "$AUTHORIZATION_COMMENT_ID" "$MANUAL_ATTEMPT_ID"
              ;;
            *)
              echo "Unsupported admission mode." >&2
              exit 1
              ;;
          esac

      - name: Run fixed-candidate admission contract
        run: sh scripts/tests/test-prod-017-hotfix-contract.sh

  deploy-production:
    name: Deploy exact production-017 candidate
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout fixed candidate commit
        uses: actions/checkout@v4
        with:
          ref: d4a13a61cc0d24c4eda96a7baffaacfd0e47c191
          path: release-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Revalidate fixed release authorization before SSH
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          MANUAL_ATTEMPT_ID: ${{ inputs.manual_attempt_id }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          case "$ADMISSION_MODE" in
            gha)
              test -z "$MANUAL_ATTEMPT_ID"
              test -z "$AUTHORIZATION_COMMENT_ID"
              sh scripts/validate-prod-017-hotfix.sh "$GITHUB_WORKSPACE/release-candidate"
              ;;
            manual)
              test -n "$MANUAL_ATTEMPT_ID"
              test -n "$AUTHORIZATION_COMMENT_ID"
              sh scripts/validate-prod-017-hotfix.sh "$GITHUB_WORKSPACE/release-candidate" manual "$AUTHORIZATION_COMMENT_ID" "$MANUAL_ATTEMPT_ID"
              ;;
            *)
              echo "Unsupported admission mode." >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KNOWN_HOSTS//[[:space:]]/}" ]]; then
            echo "Required trusted SSH known_hosts secret is empty." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cocinacore_deploy_key
          chmod 600 ~/.ssh/cocinacore_deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "Trusted SSH known_hosts does not contain VPS_HOST." >&2
            exit 1
          fi

      - name: Deploy on VPS with fixed candidate and selected one-use admission
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: d4a13a61cc0d24c4eda96a7baffaacfd0e47c191
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          MANUAL_ATTEMPT_ID: ${{ inputs.manual_attempt_id }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          run_remote() {
            REMOTE_PHASE=$1
            case "$ADMISSION_MODE" in
              manual)
                ATTEMPT_ID=$MANUAL_ATTEMPT_ID
                REMOTE_GH_TOKEN=$GH_TOKEN
                REMOTE_ADMISSION_MODE=manual
                REMOTE_COMMENT_ID=$AUTHORIZATION_COMMENT_ID
                ;;
              gha)
                ATTEMPT_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
                REMOTE_GH_TOKEN=
                REMOTE_ADMISSION_MODE=gha
                REMOTE_COMMENT_ID=
                ;;
              *) echo "Unsupported admission mode." >&2; return 1 ;;
            esac
            [[ "$RELEASE_SHA" == d4a13a61cc0d24c4eda96a7baffaacfd0e47c191 ]]
            [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$PRODUCTION_URL" == *$'\n'* || "$PRODUCTION_URL" == *$'\r'* ]]; then
              echo "Production URL contains a forbidden line break." >&2
              return 1
            fi
            if [[ "$REMOTE_ADMISSION_MODE" == manual ]]; then
              [[ "$ATTEMPT_ID" =~ ^manual-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}$ ]]
              [[ "$REMOTE_COMMENT_ID" =~ ^[0-9]{1,20}$ ]]
              [[ -n "$REMOTE_GH_TOKEN" && "$REMOTE_GH_TOKEN" != *$'\n'* && "$REMOTE_GH_TOKEN" != *$'\r'* ]]
            else
              [[ "$REMOTE_PHASE" == gha ]]
              [[ "$ATTEMPT_ID" =~ ^gha-[0-9]{1,20}-[0-9]{1,6}$ ]]
              [[ -z "$REMOTE_COMMENT_ID" && -z "$REMOTE_GH_TOKEN" ]]
            fi
            {
              printf '%s\n' "$REMOTE_GH_TOKEN" "$RELEASE_SHA" "$TRUSTED_WORKFLOW_SHA" "$PRODUCTION_URL" "$ATTEMPT_ID" "$REMOTE_ADMISSION_MODE" "$REMOTE_COMMENT_ID" "$REMOTE_PHASE"
              cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          export RELEASE_SHA TRUSTED_WORKFLOW_SHA PRODUCTION_URL ATTEMPT_ID ADMISSION_MODE AUTHORIZATION_COMMENT_ID
          case "$ADMISSION_MODE" in manual|gha) ;; *) echo "Unsupported admission mode." >&2; exit 1 ;; esac
          VPS_APP_DIR=/opt/pawtech/apps/cocinacore
          RUNTIME_ENV_FILE=/opt/pawtech/env/cocinacore.env

          command -v realpath >/dev/null 2>&1 || { echo "Required path validation command is unavailable." >&2; exit 1; }
          ACTUAL_APP_DIR=$(realpath -e "$VPS_APP_DIR")
          [ "$ACTUAL_APP_DIR" = /opt/pawtech/apps/cocinacore ] || { echo "Pinned Pawtech app directory validation failed." >&2; exit 1; }
          cd /opt/pawtech/apps/cocinacore
          git fetch --all --prune
          [[ "$RELEASE_SHA" == d4a13a61cc0d24c4eda96a7baffaacfd0e47c191 ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${TRUSTED_WORKFLOW_SHA}^{commit}"
          git merge-base --is-ancestor "$TRUSTED_WORKFLOW_SHA" origin/main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked deploy repository changes must be resolved before deployment." >&2
            exit 1
          fi

          if [[ "$ADMISSION_MODE" == manual ]]; then
            [[ "$ATTEMPT_ID" =~ ^manual-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}$ ]]
            [[ "$AUTHORIZATION_COMMENT_ID" =~ ^[0-9]{1,20}$ ]]
            [[ -n "$GH_TOKEN" ]]
            case "$REMOTE_PHASE" in
              manual-preflight|manual-deploy) ;;
              *) echo "Unsupported manual deployment phase." >&2; exit 1 ;;
            esac
            manual_mode=prod-017-$REMOTE_PHASE
            git show "$TRUSTED_WORKFLOW_SHA:scripts/deploy-pawtech-production.sh" | GH_TOKEN="$GH_TOKEN" sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" "$manual_mode" "$ATTEMPT_ID" "$AUTHORIZATION_COMMENT_ID" "$TRUSTED_WORKFLOW_SHA"
            unset GH_TOKEN
          else
            [[ "$REMOTE_PHASE" == gha ]]
            [[ -z "$GH_TOKEN" ]]
            [[ "$ATTEMPT_ID" =~ ^gha-[0-9]{1,20}-[0-9]{1,6}$ ]]
            [[ -z "$AUTHORIZATION_COMMENT_ID" ]]
            git show "$TRUSTED_WORKFLOW_SHA:scripts/deploy-pawtech-production.sh" | sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" prod-017-hotfix-preflight "$ATTEMPT_ID"
            git show "$TRUSTED_WORKFLOW_SHA:scripts/deploy-pawtech-production.sh" | sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" prod-017-hotfix-deploy "$ATTEMPT_ID"
          fi
          REMOTE_SCRIPT
            } | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
              -i ~/.ssh/cocinacore_deploy_key "$VPS_USER@$VPS_HOST" \
              "bash -c 'IFS= read -r GH_TOKEN || exit 1; IFS= read -r RELEASE_SHA || exit 1; IFS= read -r TRUSTED_WORKFLOW_SHA || exit 1; IFS= read -r PRODUCTION_URL || exit 1; IFS= read -r ATTEMPT_ID || exit 1; IFS= read -r ADMISSION_MODE || exit 1; IFS= read -r AUTHORIZATION_COMMENT_ID || exit 1; IFS= read -r REMOTE_PHASE || exit 1; export RELEASE_SHA TRUSTED_WORKFLOW_SHA PRODUCTION_URL ATTEMPT_ID ADMISSION_MODE AUTHORIZATION_COMMENT_ID REMOTE_PHASE; source /dev/stdin'"
          }
          case "$ADMISSION_MODE" in
            manual)
              run_remote manual-preflight
              run_remote manual-deploy
              ;;
            gha) run_remote gha ;;
            *) echo "Unsupported admission mode." >&2; exit 1 ;;
          esac

      - name: Production smoke check
        id: public-smoke
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          curl -fsS "${PRODUCTION_URL%/}/api/health" | node -e "let b='';process.stdin.on('data',x=>b+=x);process.stdin.on('end',()=>{try{const x=JSON.parse(b);if(x.status!=='ok'||x.dependencies?.database?.status!=='ok'||x.dependencies?.redis?.status!=='ok')process.exit(1)}catch{process.exit(1)}})"

      - name: Recover application after public smoke failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.public-smoke.outcome == 'failure' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: d4a13a61cc0d24c4eda96a7baffaacfd0e47c191
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          MANUAL_ATTEMPT_ID: ${{ inputs.manual_attempt_id }}
        run: |
          set -euo pipefail
          RUNTIME_ENV_FILE=/opt/pawtech/env/cocinacore.env
          if [[ "$ADMISSION_MODE" == manual ]]; then
            ATTEMPT_ID=$MANUAL_ATTEMPT_ID
          else
            ATTEMPT_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          fi
          printf -v remote_args '%q ' "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" rollback "$ATTEMPT_ID" "$TRUSTED_WORKFLOW_SHA"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -i ~/.ssh/cocinacore_deploy_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $remote_args" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          RELEASE_SHA=$1
          RUNTIME_ENV_FILE=$2
          PRODUCTION_URL=$3
          MODE=$4
          ATTEMPT_ID=$5
          TRUSTED_WORKFLOW_SHA=$6
          VPS_APP_DIR=/opt/pawtech/apps/cocinacore

          command -v realpath >/dev/null 2>&1 || { echo "Required path validation command is unavailable." >&2; exit 1; }
          ACTUAL_APP_DIR=$(realpath -e "$VPS_APP_DIR")
          [ "$ACTUAL_APP_DIR" = /opt/pawtech/apps/cocinacore ] || { echo "Pinned Pawtech app directory validation failed." >&2; exit 1; }
          cd /opt/pawtech/apps/cocinacore
          git fetch --all --prune
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${TRUSTED_WORKFLOW_SHA}^{commit}"
          git merge-base --is-ancestor "$TRUSTED_WORKFLOW_SHA" origin/main
          git show "$TRUSTED_WORKFLOW_SHA:scripts/deploy-pawtech-production.sh" | sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" "$MODE" "$ATTEMPT_ID"
          REMOTE_ROLLBACK
