name: Manual production Playwright acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_PRODUCTION_ACCEPTANCE to continue
        required: true
        type: string
      run_synthetic_writes:
        description: Approve the synthetic recipe write lifecycle
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-playwright-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_PRODUCTION_ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-acceptance
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run production acceptance
        if: inputs.confirmation == 'RUN_PRODUCTION_ACCEPTANCE'
        working-directory: frontend
        env:
          E2E_RUN_MODE: production
          E2E_ALLOW_SIGNUP: 'false'
          E2E_PRODUCTION_URL: ${{ secrets.E2E_PRODUCTION_URL }}
          E2E_PRODUCTION_USER_EMAIL: ${{ secrets.E2E_PRODUCTION_USER_EMAIL }}
          E2E_PRODUCTION_USER_PASSWORD: ${{ secrets.E2E_PRODUCTION_USER_PASSWORD }}
          E2E_PRODUCTION_USER_ID: ${{ secrets.E2E_PRODUCTION_USER_ID }}
          E2E_PRODUCTION_TENANT_ID: ${{ secrets.E2E_PRODUCTION_TENANT_ID }}
          E2E_PRODUCTION_SYNTHETIC_WRITES: ${{ inputs.run_synthetic_writes && 'approved' || 'disabled' }}
        run: npm run test:e2e:production

      - name: Publish safe acceptance summary
        if: always()
        working-directory: frontend
        run: |
          test -s test-results/production-acceptance-summary.json
          cat test-results/production-acceptance-summary.json

      - name: Upload safe acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-summary
          path: frontend/test-results/production-acceptance-summary.json
          retention-days: 7
