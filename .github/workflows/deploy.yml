name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA already integrated into main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-deploy:
    name: Validate production deploy SHA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      deploy_sha: ${{ steps.validate.outputs.deploy_sha }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested SHA is in main history
        id: validate
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Deploy SHA must be exactly 40 hexadecimal characters." >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}"; then
            echo "Requested SHA is not a commit available from origin." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Requested SHA is not integrated into origin/main." >&2
            exit 1
          fi

          echo "deploy_sha=${DEPLOY_SHA,,}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: validate-deploy
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-deploy.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Test with coverage
        run: |
          cd frontend
          npm run test:coverage

      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Validate PawTech production deploy contract
        run: sh scripts/tests/test-pawtech-production-deploy-contract.sh

      - name: Validate PawTech Step 4 contract
        run: sh scripts/tests/test-pawtech-step4-contract.sh

      - name: Validate bootstrap and migrator configuration
        run: sh scripts/tests/test-bootstrap-migrator-config.sh

      - name: Validate PawTech Step 5 workflow contract
        run: sh scripts/tests/test-pawtech-step5-workflow-contract.sh

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KNOWN_HOSTS//[[:space:]]/}" ]]; then
            echo "Required trusted SSH known_hosts secret is empty." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cocinacore_deploy_key
          chmod 600 ~/.ssh/cocinacore_deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "Trusted SSH known_hosts does not contain VPS_HOST." >&2
            exit 1
          fi

      - name: Deploy on VPS
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ needs.validate-deploy.outputs.deploy_sha }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          VPS_APP_DIR=/opt/pawtech/apps/cocinacore
          printf -v remote_args '%q ' "$RELEASE_SHA" "$PRODUCTION_URL" "$ATTEMPT_ID"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -i ~/.ssh/cocinacore_deploy_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $remote_args" <<'REMOTE_SCRIPT'
          set -euo pipefail

          RELEASE_SHA=$1
          PRODUCTION_URL=$2
          ATTEMPT_ID=$3
          VPS_APP_DIR=/opt/pawtech/apps/cocinacore
          RUNTIME_ENV_FILE=/opt/pawtech/env/cocinacore.env

          command -v realpath >/dev/null 2>&1 || { echo "Required path validation command is unavailable." >&2; exit 1; }
          ACTUAL_APP_DIR=$(realpath -e "$VPS_APP_DIR")
          [ "$ACTUAL_APP_DIR" = /opt/pawtech/apps/cocinacore ] || { echo "Pinned Pawtech app directory validation failed." >&2; exit 1; }
          cd /opt/pawtech/apps/cocinacore
          git fetch --all --prune
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked deploy repository changes must be resolved before deployment." >&2
            exit 1
          fi

          git show "$RELEASE_SHA:scripts/deploy-pawtech-production.sh" | sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" preflight "$ATTEMPT_ID"

          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -x scripts/deploy-pawtech-production.sh

          scripts/deploy-pawtech-production.sh "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" deploy "$ATTEMPT_ID"
          REMOTE_SCRIPT

      - name: Production smoke check
        id: public-smoke
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          curl -fsS "${PRODUCTION_URL%/}/api/health" | node -e "let b='';process.stdin.on('data',x=>b+=x);process.stdin.on('end',()=>{try{const x=JSON.parse(b);if(x.status!=='ok'||x.dependencies?.database?.status!=='ok'||x.dependencies?.redis?.status!=='ok')process.exit(1)}catch{process.exit(1)}})"

      - name: Recover application after public smoke failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.public-smoke.outcome == 'failure' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ needs.validate-deploy.outputs.deploy_sha }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          ATTEMPT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          RUNTIME_ENV_FILE=/opt/pawtech/env/cocinacore.env
          printf -v remote_args '%q ' "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" rollback "$ATTEMPT_ID"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -i ~/.ssh/cocinacore_deploy_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $remote_args" <<'REMOTE_ROLLBACK'
          set -euo pipefail

          RELEASE_SHA=$1
          RUNTIME_ENV_FILE=$2
          PRODUCTION_URL=$3
          MODE=$4
          ATTEMPT_ID=$5
          VPS_APP_DIR=/opt/pawtech/apps/cocinacore

          command -v realpath >/dev/null 2>&1 || { echo "Required path validation command is unavailable." >&2; exit 1; }
          ACTUAL_APP_DIR=$(realpath -e "$VPS_APP_DIR")
          [ "$ACTUAL_APP_DIR" = /opt/pawtech/apps/cocinacore ] || { echo "Pinned Pawtech app directory validation failed." >&2; exit 1; }
          cd /opt/pawtech/apps/cocinacore
          git show "$RELEASE_SHA:scripts/deploy-pawtech-production.sh" | sh -s -- "$RELEASE_SHA" "$RUNTIME_ENV_FILE" "$PRODUCTION_URL" "$MODE" "$ATTEMPT_ID"
          REMOTE_ROLLBACK
