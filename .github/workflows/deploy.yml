name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Test with coverage
        run: |
          cd frontend
          npm run test:coverage

      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/cocinacore_deploy_key
          chmod 600 ~/.ssh/cocinacore_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/cocinacore_deploy_key "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && \
             git fetch --all --prune && \
             git checkout '$RELEASE_SHA' && \
             docker compose -f docker-compose.prod.yml --env-file .env.production build app && \
             docker compose -f docker-compose.prod.yml --env-file .env.production up -d postgres redis && \
             docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app npm run db:migrate && \
             docker compose -f docker-compose.prod.yml --env-file .env.production up -d app"

      - name: Production smoke check
        run: curl -fsS "${{ secrets.PRODUCTION_URL }}/api/health"
