name: Migrate production schema

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA already integrated into main
        required: true
        type: string
      approval_reference:
        description: Manual owner approval receipt for U5 migrations 016/017 (not an enforced GitHub reviewer gate)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cocinacore-production-operations
  cancel-in-progress: false

jobs:
  validate-sha:
    name: Validate production migration SHA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      migration_sha: ${{ steps.validate.outputs.migration_sha }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate requested SHA is integrated into main
        id: validate
        shell: bash
        env:
          MIGRATION_SHA: ${{ inputs.sha }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          # Manual owner consent was obtained separately. This receipt is an
          # operator attestation, not a GitHub-enforced reviewer approval.
          if [[ "$APPROVAL_REFERENCE" != 'U5-016-017-20261018-owner-approved' ]]; then
            echo "Recorded U5 migrations 016/017 owner approval reference is missing or invalid." >&2
            exit 1
          fi
          echo "MANUAL_APPROVAL_RECEIPT=U5-016-017-20261018-owner-approved"
          if [[ ! "$MIGRATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Migration SHA must be exactly 40 hexadecimal characters." >&2
            exit 1
          fi
          # checkout with fetch-depth: 0 already fetched origin/main with its
          # authenticated checkout credential. Do not perform a second fetch:
          # persist-credentials is deliberately false for this private repo.
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The checkout did not include origin/main." >&2
            exit 1
          fi
          if ! git cat-file -e "${MIGRATION_SHA}^{commit}"; then
            echo "Requested SHA is not a commit available from origin." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MIGRATION_SHA" origin/main; then
            echo "Requested SHA is not integrated into origin/main." >&2
            exit 1
          fi
          echo "migration_sha=${MIGRATION_SHA,,}" >> "$GITHUB_OUTPUT"

  migrate-production:
    name: Apply migrations 016/017 on production VPS
    runs-on: ubuntu-latest
    needs: validate-sha
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact-SHA source archive
        env:
          MIGRATION_SHA: ${{ needs.validate-sha.outputs.migration_sha }}
        run: |
          set -euo pipefail
          git archive --format=tar "$MIGRATION_SHA" > migration-source.tar
          sha256sum migration-source.tar | awk '{print $1}' > migration-source.tar.sha256
      - name: Build exact-SHA migration image on runner
        env:
          MIGRATION_SHA: ${{ needs.validate-sha.outputs.migration_sha }}
        run: |
          set -euo pipefail
          mkdir migration-source
          tar -xf migration-source.tar -C migration-source
          IMAGE="cocinacore:migrate-$MIGRATION_SHA"
          docker build --progress=plain --pull=false \
            --label "org.opencontainers.image.revision=$MIGRATION_SHA" \
            -t "$IMAGE" -f migration-source/Dockerfile migration-source
          docker save "$IMAGE" -o migration-image.tar
          sha256sum migration-image.tar | awk '{print $1}' > migration-image.tar.sha256
      - name: Configure strict SSH trust
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KNOWN_HOSTS//[[:space:]]/}" ]]; then
            echo "Required trusted SSH known_hosts secret is empty." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cocinacore_migration_key
          chmod 600 ~/.ssh/cocinacore_migration_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "Trusted SSH known_hosts does not contain VPS_HOST." >&2
            exit 1
          fi
      - name: Transfer exact-SHA source and image archives to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REMOTE_BASE="/tmp/cocinacore-migration-${RUN_ID}-${RUN_ATTEMPT}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 \
            -i ~/.ssh/cocinacore_migration_key "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE_BASE'"
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 \
            -i ~/.ssh/cocinacore_migration_key migration-source.tar migration-source.tar.sha256 \
            migration-image.tar migration-image.tar.sha256 "$VPS_USER@$VPS_HOST:$REMOTE_BASE/"
      - name: Load and verify migration image on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MIGRATION_SHA: ${{ needs.validate-sha.outputs.migration_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REMOTE_BASE="/tmp/cocinacore-migration-${RUN_ID}-${RUN_ATTEMPT}"
          IMAGE="cocinacore:migrate-$MIGRATION_SHA"
          printf -v remote_args '%q ' "$REMOTE_BASE/migration-image.tar" "$REMOTE_BASE/migration-image.tar.sha256" "$IMAGE" "$MIGRATION_SHA"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 \
            -i ~/.ssh/cocinacore_migration_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $remote_args" <<'REMOTE_SCRIPT'
          set -euo pipefail
          IMAGE_ARCHIVE=$1
          IMAGE_SHA_FILE=$2
          IMAGE=$3
          RELEASE_SHA=$4
          [ -f "$IMAGE_ARCHIVE" ] && [ -f "$IMAGE_SHA_FILE" ]
          [ "$(sha256sum "$IMAGE_ARCHIVE" | awk '{print $1}')" = "$(awk '{print $1}' "$IMAGE_SHA_FILE")" ]
          docker load -i "$IMAGE_ARCHIVE"
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$RELEASE_SHA" ]
          REMOTE_SCRIPT
      - name: Apply exact-SHA production migration procedure
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MIGRATION_SHA: ${{ needs.validate-sha.outputs.migration_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REMOTE_BASE="/tmp/cocinacore-migration-${RUN_ID}-${RUN_ATTEMPT}"
          REMOTE_ARCHIVE="$REMOTE_BASE/migration-source.tar"
          ARCHIVE_SHA256=$(awk '{print $1}' migration-source.tar.sha256)
          printf -v remote_args '%q ' "$MIGRATION_SHA" "$REMOTE_ARCHIVE" "$ARCHIVE_SHA256"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 \
            -i ~/.ssh/cocinacore_migration_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $remote_args" <<'REMOTE_SCRIPT'
          set -euo pipefail
          RELEASE_SHA=$1
          ARCHIVE=$2
          ARCHIVE_SHA256=$3
          SOURCE_DIR=$(mktemp -d /tmp/cocinacore-migration-entry.XXXXXXXX)
          trap 'rm -rf -- "$SOURCE_DIR"; rm -f -- "$ARCHIVE"' EXIT HUP INT TERM
          mkdir -p "$SOURCE_DIR/scripts"
          tar -xf "$ARCHIVE" -C "$SOURCE_DIR" scripts/migrate-pawtech-production.sh
          [ -f "$SOURCE_DIR/scripts/migrate-pawtech-production.sh" ]
          sh "$SOURCE_DIR/scripts/migrate-pawtech-production.sh" "$RELEASE_SHA" "$ARCHIVE" "$ARCHIVE_SHA256"
          REMOTE_SCRIPT
