name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Validate bootstrap and migrator configuration
        run: sh ../scripts/tests/test-bootstrap-migrator-config.sh

      - name: Test bootstrap and migrator PostgreSQL boundary
        run: sh ../scripts/test-bootstrap-migrator-integration.sh

      - name: Test canonical email PostgreSQL invariant
        run: sh ../scripts/test-canonical-email-integration.sh

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cocinacore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cocinacore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COCINACORE_SEPARATED_DB_LANES_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cocinacore
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cocinacore
      MIGRATION_DATABASE_URL: postgresql://migration_admin:ci-migration-admin-password-2026@localhost:5432/cocinacore
      MIGRATION_ADMIN_PASSWORD: ci-migration-admin-password-2026
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-change-me
      GEMINI_API_KEY: CHANGE_ME
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: ./uploads
      E2E_USER_EMAIL: test@cocinacore.local
      E2E_USER_PASSWORD: TestPassword123!
      E2E_OWNER_EMAIL: test@cocinacore.local
      E2E_OWNER_PASSWORD: TestPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Provision database migration roles
        run: npm run db:provision

      - name: Run database migrations
        run: npm run db:migrate

      - name: Verify migration ledger completeness
        run: npm run db:migrate:verify

      - name: Seed E2E owner user
        run: npm run db:bootstrap -- "$E2E_USER_EMAIL" "CI Owner" "$E2E_USER_PASSWORD"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
