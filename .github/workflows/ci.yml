name: CI

on:
  workflow_dispatch:
    inputs:
      run_connected_today:
        description: Run the connected Today journey against isolated hosted services
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Validate bootstrap and migrator configuration
        run: sh ../scripts/tests/test-bootstrap-migrator-config.sh

      - name: Validate persistent recipe migration contract
        run: sh ../scripts/tests/test-persistent-recipe-migration-contract.sh

      - name: Validate PawTech production deploy contract
        run: sh ../scripts/tests/test-pawtech-production-deploy-contract.sh

      - name: Validate PawTech production migration contract
        run: sh ../scripts/tests/test-pawtech-migration-contract.sh

      - name: Validate PawTech Step 4 contract
        run: sh ../scripts/tests/test-pawtech-step4-contract.sh

      - name: Validate PawTech Step 5 workflow contract
        run: sh ../scripts/tests/test-pawtech-step5-workflow-contract.sh

      - name: Validate hosted Today E2E workflow contract
        run: sh ../scripts/tests/test-hosted-today-e2e-workflow-contract.sh

      - name: Test PawTech daily backup verification scenario
        run: sh ../scripts/tests/test-pawtech-daily-backup-verification.sh

      - name: Validate E2E runner compatibility
        run: sh ../scripts/tests/test-ci-e2e-runner-contract.sh

      - name: Validate Docker application route context
        run: sh ../scripts/tests/test-dockerignore-route-contract.sh

      - name: Test production acceptance isolation gate
        run: node ../scripts/tests/production-acceptance-isolation.test.mjs

      - name: Test production acceptance manifest recovery
        run: node ../scripts/tests/production-acceptance-fixture-manifest.test.mjs

      - name: Validate protected M4 fixture workflow
        run: bash ../scripts/tests/test-m4-acceptance-fixture-workflow.sh

      - name: Validate GitHub Actions expressions with pinned actionlint
        run: bash ../scripts/ci/run-actionlint.sh

      - name: Build and inspect Docker application routes
        run: sh ../scripts/tests/test-docker-image-route-contract.sh

      - name: Test bootstrap and migrator PostgreSQL boundary
        run: sh ../scripts/test-bootstrap-migrator-integration.sh

      - name: Test canonical email PostgreSQL invariant
        run: sh ../scripts/test-canonical-email-integration.sh

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cocinacore_local_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cocinacore_local_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COCINACORE_SEPARATED_DB_LANES_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5435/cocinacore_local_db
      BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5435/cocinacore_local_db
      MIGRATION_DATABASE_URL: postgresql://migration_admin:ci-migration-admin-password-2026@127.0.0.1:5435/cocinacore_local_db
      MIGRATION_ADMIN_PASSWORD: ci-migration-admin-password-2026
      REDIS_URL: redis://127.0.0.1:6381/15
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5435/cocinacore_local_db
      E2E_REDIS_URL: redis://127.0.0.1:6381/15
      AUTH_SECRET: ci-auth-secret-change-me
      GEMINI_API_KEY: CHANGE_ME
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: ./uploads
      E2E_USER_EMAIL: test@cocinacore.local
      E2E_USER_PASSWORD: TestPassword123!
      E2E_OWNER_EMAIL: test@cocinacore.local
      E2E_OWNER_PASSWORD: TestPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Provision database migration roles
        run: npm run db:provision

      - name: Run database migrations
        run: npm run db:migrate

      - name: Verify migration ledger completeness
        run: npm run db:migrate:verify

      - name: Seed E2E owner user
        run: npm run db:bootstrap -- "$E2E_USER_EMAIL" "CI Owner" "$E2E_USER_PASSWORD"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run connected Today Playwright journey
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/m3-4-u5-hosted-e2e' && inputs.run_connected_today == true
        env:
          COCINACORE_ISOLATED_E2E: "1"
          E2E_PROVIDER_PORT: "4319"
        run: npm run test:e2e -- e2e/specs/today-recommendations-connected.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
