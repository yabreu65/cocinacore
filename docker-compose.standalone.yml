# Dedicated stack; always use an explicit project name and private env files.
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    env_file: ${CC_POSTGRES_ENV:?private postgres env file required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &bounded_logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    env_file: ${CC_REDIS_ENV:?private redis env file required}
    command: [sh, -ec, 'test -n "$$REDIS_PASSWORD"; exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *bounded_logs
  operations:
    image: ${CC_OPERATIONS_IMAGE:?immutable operations image required}
    profiles: [operations]
    restart: 'no'
    env_file: ${CC_OPERATIONS_ENV:?private operations env file required}
    volumes:
      - ./scripts/standalone-bootstrap-db.sh:/app/bootstrap-db.sh:ro
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *bounded_logs
volumes:
  postgres_data:
  redis_data:
networks:
  data:
    internal: true
