server_tokens off;
# Exclude query strings, cookies and authorization headers from access logs.
log_format cocina_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout cocina_access;
    client_max_body_size 2m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Preserve the stricter application framing policy, including proxy errors.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Resolve Docker DNS at request time, including after app recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Cocina-Client-Id $remote_addr;
    proxy_set_header Connection "";
    # Multipart PDF plus client-produced embeddings, bounded total body size.
    location = /api/owner/global-pdfs {
        client_max_body_size 50m;
        proxy_pass $backend;
    }
    location / {
        proxy_pass $backend;
    }
}
